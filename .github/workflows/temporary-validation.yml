name: Temporary Validation

on:
  push:
    branches:
      - fix/form-conversion-tracking
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Static conversion tests
        run: node --test tests/hostinger-static.test.mjs
