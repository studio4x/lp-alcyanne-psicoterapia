name: Temporary LP Validation

on:
  push:
    branches:
      - feat/lp-conversion-copy
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Static landing tests
        run: node --test tests/hostinger-static.test.mjs
